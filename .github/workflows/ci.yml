name: CI
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test-rails-4:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false # TODO: remove this once testing is finished
      matrix:
        rails: [ '4.0', '4.1', '4.2' ]
        ruby: [ '2.1', '2.2', '2.3', '2.4', '2.5' ]
    name: Ruby ${{ matrix.ruby }} and Rails ${{ matrix.rails }}
    env:
      RAILS_VERSION: ${{ matrix.rails }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - uses: ruby/setup-ruby@v1
        with:
          bundler: '1'
          bundler-cache: true
          ruby-version: ${{ matrix.ruby }}
      - run: bundle exec rake

  test-rails-5:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false # TODO: remove this once testing is finished
      matrix:
        rails: [ '5.0.0', '5.1.0', '5.2.0' ]
        ruby: [ '2.4', '2.5', '2.6', '2.7' ]
    name: Ruby ${{ matrix.ruby }} and Rails ${{ matrix.rails }}
    env:
      RAILS_VERSION: ${{ matrix.rails }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
        if: ${{ matrix.rails == '5.0.0' }}
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          ruby-version: ${{ matrix.ruby }}
      - run: bundle exec rake

  test-rails-6:
    uses: ./.github/workflows/ci-common.yml
    strategy:
      fail-fast: false # TODO: remove this once testing is finished
      matrix:
        rails: [ '6.0.0', '6.1.0' ]
        ruby: [ '2.5', '2.6', '2.7', '3.0', '3.1', '3.2', '3.3', '3.4' ]

  test-rails-7:
    uses: ./.github/workflows/ci-common.yml
    strategy:
      fail-fast: false # TODO: remove this once testing is finished
      matrix:
        rails: [ '7.0.1', '7.1.0', '7.2.0' ]
        ruby: [ '2.7', '3.0', '3.1', '3.2', '3.3', '3.4' ]
        exclude:
          - { rails: '7.2.0', ruby: '2.7' }
          - { rails: '7.2.0', ruby: '3.0' }

  test-rails-8:
    uses: ./.github/workflows/ci-common.yml
    strategy:
      fail-fast: false # TODO: remove this once testing is finished
      matrix:
        rails: [ '8.0.0' ]
        ruby: [ '3.2', '3.3', '3.4' ]
