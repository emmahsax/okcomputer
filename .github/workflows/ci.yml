name: CI
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        rails: [ '5.0.0', '5.1.0', '5.2.0', '6.0.0', '6.1.0', '7.0.1', '7.1.0', '7.2.0', '8.0.0' ]
        ruby: [ '2.4', '2.5', '2.6', '2.7', '3.0', '3.1', '3.2', '3.3', '3.4' ]
        bundler: [ 'default' ]
        exclude:
          # Rails 5.x does not support Ruby >= 3.0
          - { rails: /^5\.\d+\.0$/, ruby: /^3\.\d+$/ }

          # Rails 6.x does not support Ruby 2.4
          - { rails: /^6\.\d+\.0$/, ruby: '2.4' }

          # Rails 7.x does not support Ruby < 2.7 (specific versions)
          - { rails: /^7\.0\.1$/, ruby: /^2\.[4-6]$/ }
          - { rails: /^7\.1\.0$/, ruby: /^2\.[4-6]$/ }

          # Rails 7.2.x does not support Ruby < 3.1
          - { rails: /^7\.2\.0$/, ruby: /^(2\.[4-7]|3\.0)$/ }

          # Rails 8.x does not support Ruby < 3.2
          - { rails: /^8\.\d+\.0$/, ruby: /^(2\.\d|3\.[0-1])$/ }
        include:
          - { ruby: '2.1', rails: '4.0', bundler: '1' }
          - { ruby: '2.1', rails: '4.1', bundler: '1' }
          - { ruby: '2.1', rails: '4.2', bundler: '1' }
          - { ruby: '2.2', rails: '4.0', bundler: '1' }
          - { ruby: '2.2', rails: '4.1', bundler: '1' }
          - { ruby: '2.2', rails: '4.2', bundler: '1' }
          - { ruby: '2.3', rails: '4.0', bundler: '1' }
          - { ruby: '2.3', rails: '4.1', bundler: '1' }
          - { ruby: '2.3', rails: '4.2', bundler: '1' }
          - { ruby: '2.4', rails: '4.0', bundler: '1' }
          - { ruby: '2.4', rails: '4.1', bundler: '1' }
          - { ruby: '2.4', rails: '4.2', bundler: '1' }
          - { ruby: '2.5', rails: '4.0', bundler: '1' }
          - { ruby: '2.5', rails: '4.1', bundler: '1' }
          - { ruby: '2.5', rails: '4.2', bundler: '1' }

    # strategy:
