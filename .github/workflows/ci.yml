name: CI
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # ruby: [2.5, 2.6, 2.7, 3.0, 3.1, 3.2, 3.3]
        # rails: [5.1.0, 5.2.0, 6.0.0, 6.1.0, 7.0.0, 7.1.0, 7.2.0, 8.0.0]
        ruby: [3.0, 3.1, 3.2, 3.3]
        rails: [7.0.0, 7.1.0, 7.2.0]
        bundler: [default]
        include:
          # - { ruby: "2.4", rails: "4.2", bundler: "1" }
          # - { ruby: "2.5", rails: "4.2", bundler: "1" }
          # - { ruby: "2.7", rails: "7.0", bundler: "default" }
          - { ruby: "3.2", rails: "8.0", bundler: "default" }

    name: Ruby ${{ matrix.ruby }} and Rails ${{ matrix.rails }}
    env:
      RAILS_VERSION: ${{ matrix.rails }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          bundler: ${{ matrix.bundler }}
          ruby-version: ${{ matrix.ruby }}
      - run: bundle exec rake
