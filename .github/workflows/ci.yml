name: CI
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest # ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # ruby: [2.5, 2.6, 2.7]
        # rails: [5.1.0, 5.2.0, 6.0.0, 6.1.0]
        rails: [ '5.0.0'] #, '5.1.0', '5.2.0', '6.0.0', '6.1.0', '7.0.1', '7.1.0', '7.2.0', '8.0.0' ]
        ruby: [ '2.4'] #, '2.5', '2.6', '2.7', '3.0', '3.1', '3.2', '3.3', '3.4' ]
        bundler: [ 'default' ]
        exclude:
          # - { rails: '5.0.0', ruby: '2.6', bundler: 'default' }
          - { rails: '5.0.0', ruby: '3.0' }
          - { rails: '5.0.0', ruby: '3.1' }
          - { rails: '5.0.0', ruby: '3.2' }
          - { rails: '5.0.0', ruby: '3.3' }
          - { rails: '5.0.0', ruby: '3.4' }
          - { rails: '5.1.0', ruby: '3.0' }
          - { rails: '5.1.0', ruby: '3.1' }
          - { rails: '5.1.0', ruby: '3.2' }
          - { rails: '5.1.0', ruby: '3.3' }
          - { rails: '5.1.0', ruby: '3.4' }
          - { rails: '5.2.0', ruby: '3.0' }
          - { rails: '5.2.0', ruby: '3.1' }
          - { rails: '5.2.0', ruby: '3.2' }
          - { rails: '5.2.0', ruby: '3.3' }
          - { rails: '5.2.0', ruby: '3.4' }
          - { rails: '6.0.0', ruby: '2.4' }
          - { rails: '6.1.0', ruby: '2.4' }
          - { rails: '7.0.1', ruby: '2.4' }
          - { rails: '7.0.1', ruby: '2.6' }
          - { rails: '7.1.0', ruby: '2.4' }
          - { rails: '7.1.0', ruby: '2.6' }
          - { rails: '7.2.0', ruby: '2.4' }
          - { rails: '7.2.0', ruby: '2.6' }
          - { rails: '7.2.0', ruby: '2.7' }
          - { rails: '7.2.0', ruby: '3.0' }
          - { rails: '8.0.0', ruby: '2.4' }
          - { rails: '8.0.0', ruby: '2.6' }
          - { rails: '8.0.0', ruby: '2.7' }
          - { rails: '8.0.0', ruby: '3.0' }
          - { rails: '8.0.0', ruby: '3.1' }
        include:
          # - { rails: '5.0.0', ruby: '2.6', bundler: '1' }
          - { ruby: "2.0", rails: "4.2", bundler: "1" }
          - { ruby: "2.1", rails: "4.2", bundler: "1" }
          - { ruby: "2.2", rails: "4.2", bundler: "1" }
          - { ruby: "2.3", rails: "4.2", bundler: "1" }
          - { ruby: "2.4", rails: "4.2", bundler: "1" }
          - { ruby: "2.5", rails: "4.2", bundler: "1" }

    name: Ruby ${{ matrix.ruby }} and Rails ${{ matrix.rails }}
    env:
      RAILS_VERSION: ${{ matrix.rails }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
        if: ${{ matrix.rails <= '5.0.0' && matrix.ruby <= '2.6' }}
      - uses: ruby/setup-ruby@v1
        with:
          bundler: ${{ matrix.bundler }}
          bundler-cache: true
          ruby-version: ${{ matrix.ruby }}
      - run: bundle exec rake

  # rails-5:
  #   runs-on: ubuntu-latest
  #   name: Ruby 2.7 and Rails 5.0.0
  #   env:
  #     RAILS_VERSION: '5.0.0'
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: ruby/setup-ruby@v1
  #       with:
  #         bundler-cache: true
  #         ruby-version: '2.7'
  #     - run: bundle exec rake
