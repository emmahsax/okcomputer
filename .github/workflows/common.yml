name: CI Common

on:
  workflow_call:
    inputs:
      ruby:
        required: true
        type: string
      rails:
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-24.04
    name: Ruby ${{ inputs.ruby }} and Rails ${{ inputs.rails }}
    env:
      RAILS_VERSION: ${{ inputs.rails }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          ruby-version: ${{ inputs.ruby }}
      - run: bundle exec rake
